<script>
const SCENARIO_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSRGm4-S_MuIQCpXBcM9x_AugxZbkHBarZywtfqgBqpWTk5uai6hZzMYut7z6pFL020YqeezQs7hQl4/pub?gid=168341961&single=true&output=csv';

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0; i<text.length; i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else if(c === '\r'){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v && v.trim() !== ''));
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function renderScenarios(){
  const el = document.getElementById('scenarioList');
  if(!el) return;
  try{
    const res = await fetch(SCENARIO_CSV_URL, {cache: 'no-store'});
    if(!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    const rows = parseCSV(text);
    if(rows.length <= 1){
      el.innerHTML = `<div class="scenario-empty">아직 등록된 시나리오가 없어요. 첫 번째 승리 시나리오를 남겨보세요!</div>`;
      return;
    }
    const items = rows.slice(1).map(r => ({
      title: r[0] || '', author: r[1] || '익명', content: r[2] || '', date: r[3] || ''
    })).reverse();

    el.innerHTML = items.map(it => `
      <div class="scenario-card">
        <div class="top-row">
          <h3>${escapeHtml(it.title)}</h3>
          <span class="meta">${escapeHtml(it.date)}</span>
        </div>
        <p>${escapeHtml(it.content)}</p>
      </div>
    `).join('');
  } catch(e){
    el.innerHTML = `<div class="scenario-empty">시나리오를 불러오지 못했어요. 잠시 후 다시 시도해주세요.</div>`;
  }
}

renderScenarios();
</script>
